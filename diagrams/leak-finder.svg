<svg xmlns="http://www.w3.org/2000/svg" width="672" height="476" viewBox="0 0 672 476" role="img" aria-label="leak-finder workflow diagram">
<title>leak-finder</title>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--grp:#f3f5f8;--line:#c3cad3;--cheap:#dbeafe;--cheapL:#93b4e6;--agent:#ede9fe;--agentL:#b3a3ef;--result:#dcfce7;--resultL:#86d19e;--human:#ffedd5;--humanL:#f0b27a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e6e8eb;--mut:#9aa4af;--grp:#171a21;--line:#3a414c;--cheap:#1c2b46;--cheapL:#3f6aa8;--agent:#2a2347;--agentL:#6a58b5;--result:#16341f;--resultL:#3f8b58;--human:#3d2a14;--humanL:#b97a3a}}
text{font:13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:var(--fg)}
.t{font-weight:700;font-size:18px}.sub{fill:var(--mut);font-size:13px}.ct{font-weight:700;font-size:14px}.cn{fill:var(--mut);font-size:12px}.bt{font-size:12.5px}
.grp{fill:var(--grp);stroke:var(--line)}.b{stroke-width:1.2}
.b.cheap{fill:var(--cheap);stroke:var(--cheapL)}.b.agent{fill:var(--agent);stroke:var(--agentL)}.b.result{fill:var(--result);stroke:var(--resultL)}.b.human{fill:var(--human);stroke:var(--humanL)}
.arrow{stroke:var(--mut);stroke-width:1.6;fill:none}.head{fill:var(--mut)}
</style>
<rect width="672" height="476" rx="10" fill="var(--bg)"/>
<text class="t" x="24" y="30">leak-finder</text><text class="sub" x="24" y="50">Where does a small business lose leads and time? Public pages only, evidence for every claim.</text>
<text class="ct" x="24" y="82">Inspect</text><text class="cn" x="24" y="99">per site, 6 areas in parallel</text><rect class="grp" x="24" y="108" width="196" height="322" rx="10"/><rect class="b cheap" x="34" y="118" width="176" height="42" rx="7"/><text class="bt" x="122" y="144" text-anchor="middle">Lead capture</text><rect class="b cheap" x="34" y="170" width="176" height="42" rx="7"/><text class="bt" x="122" y="196" text-anchor="middle">Booking path</text><rect class="b cheap" x="34" y="222" width="176" height="42" rx="7"/><text class="bt" x="122" y="248" text-anchor="middle">Follow-up</text><rect class="b cheap" x="34" y="274" width="176" height="42" rx="7"/><text class="bt" x="122" y="300" text-anchor="middle">Reputation</text><rect class="b cheap" x="34" y="326" width="176" height="42" rx="7"/><text class="bt" x="122" y="352" text-anchor="middle">Manual work</text><rect class="b cheap" x="34" y="378" width="176" height="42" rx="7"/><text class="bt" x="122" y="404" text-anchor="middle">Basics</text><path class="arrow" d="M224 269 h6"/><path class="head" d="M230 265 l6 4 l-6 4z"/><text class="ct" x="238" y="82">Verify</text><text class="cn" x="238" y="99">merge, then check the top few</text><rect class="grp" x="238" y="212" width="196" height="114" rx="10"/><rect class="b cheap" x="248" y="222" width="176" height="42" rx="7"/><text class="bt" x="336" y="248" text-anchor="middle">Merge duplicate leaks</text><rect class="b cheap" x="248" y="274" width="176" height="42" rx="7"/><text class="bt" x="336" y="291" text-anchor="middle">Re-open the page for the</text><text class="bt" x="336" y="306" text-anchor="middle">top 8; does it still</text><path class="arrow" d="M438 269 h6"/><path class="head" d="M444 265 l6 4 l-6 4z"/><text class="ct" x="452" y="82">Report</text><text class="cn" x="452" y="99">per site</text><rect class="grp" x="452" y="186" width="196" height="166" rx="10"/><rect class="b result" x="462" y="196" width="176" height="42" rx="7"/><text class="bt" x="550" y="222" text-anchor="middle">Top 3 leaks</text><rect class="b agent" x="462" y="248" width="176" height="42" rx="7"/><text class="bt" x="550" y="274" text-anchor="middle">Quick wins</text><rect class="b agent" x="462" y="300" width="176" height="42" rx="7"/><text class="bt" x="550" y="317" text-anchor="middle">Questions for the</text><text class="bt" x="550" y="332" text-anchor="middle">diagnostic call</text>
<rect class="b cheap" x="24" y="453" width="12" height="12" rx="3"/><text class="cn" x="42" y="463">cheaper model (Sonnet)</text><rect class="b agent" x="205.2" y="453" width="12" height="12" rx="3"/><text class="cn" x="223.2" y="463">session model</text><rect class="b result" x="327" y="453" width="12" height="12" rx="3"/><text class="cn" x="345" y="463">output</text><rect class="b human" x="402.6" y="453" width="12" height="12" rx="3"/><text class="cn" x="420.6" y="463">you</text>
</svg>