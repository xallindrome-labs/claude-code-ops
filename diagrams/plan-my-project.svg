<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="372" viewBox="0 0 1528 372" role="img" aria-label="plan-my-project workflow diagram">
<title>plan-my-project</title>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--grp:#f3f5f8;--line:#c3cad3;--cheap:#dbeafe;--cheapL:#93b4e6;--agent:#ede9fe;--agentL:#b3a3ef;--result:#dcfce7;--resultL:#86d19e;--human:#ffedd5;--humanL:#f0b27a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e6e8eb;--mut:#9aa4af;--grp:#171a21;--line:#3a414c;--cheap:#1c2b46;--cheapL:#3f6aa8;--agent:#2a2347;--agentL:#6a58b5;--result:#16341f;--resultL:#3f8b58;--human:#3d2a14;--humanL:#b97a3a}}
text{font:13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:var(--fg)}
.t{font-weight:700;font-size:18px}.sub{fill:var(--mut);font-size:13px}.ct{font-weight:700;font-size:14px}.cn{fill:var(--mut);font-size:12px}.bt{font-size:12.5px}
.grp{fill:var(--grp);stroke:var(--line)}.b{stroke-width:1.2}
.b.cheap{fill:var(--cheap);stroke:var(--cheapL)}.b.agent{fill:var(--agent);stroke:var(--agentL)}.b.result{fill:var(--result);stroke:var(--resultL)}.b.human{fill:var(--human);stroke:var(--humanL)}
.arrow{stroke:var(--mut);stroke-width:1.6;fill:none}.head{fill:var(--mut)}
</style>
<rect width="1528" height="372" rx="10" fill="var(--bg)"/>
<text class="t" x="24" y="30">plan-my-project</text><text class="sub" x="24" y="50">Idea to executable plan files, with you deciding in the middle.</text>
<text class="ct" x="24" y="82">Frame</text><text class="cn" x="24" y="99">stage 1: research</text><rect class="grp" x="24" y="186" width="196" height="62" rx="10"/><rect class="b agent" x="34" y="196" width="176" height="42" rx="7"/><text class="bt" x="122" y="222" text-anchor="middle">Angles + open decisions</text><path class="arrow" d="M224 217 h6"/><path class="head" d="M230 213 l6 4 l-6 4z"/><text class="ct" x="238" y="82">Research</text><text class="cn" x="238" y="99">one per angle</text><rect class="grp" x="238" y="108" width="196" height="218" rx="10"/><rect class="b cheap" x="248" y="118" width="176" height="42" rx="7"/><text class="bt" x="336" y="144" text-anchor="middle">Prior art</text><rect class="b cheap" x="248" y="170" width="176" height="42" rx="7"/><text class="bt" x="336" y="196" text-anchor="middle">Feasibility + cost</text><rect class="b cheap" x="248" y="222" width="176" height="42" rx="7"/><text class="bt" x="336" y="248" text-anchor="middle">Users + demand</text><rect class="b cheap" x="248" y="274" width="176" height="42" rx="7"/><text class="bt" x="336" y="300" text-anchor="middle">Risks + rules</text><path class="arrow" d="M438 217 h6"/><path class="head" d="M444 213 l6 4 l-6 4z"/><text class="ct" x="452" y="82">Brief</text><text class="cn" x="452" y="99">decisions with recommendations</text><rect class="grp" x="452" y="186" width="196" height="62" rx="10"/><rect class="b result" x="462" y="196" width="176" height="42" rx="7"/><text class="bt" x="550" y="222" text-anchor="middle">Decision brief</text><path class="arrow" d="M652 217 h6"/><path class="head" d="M658 213 l6 4 l-6 4z"/><text class="ct" x="666" y="82">You</text><text class="cn" x="666" y="99">the human step</text><rect class="grp" x="666" y="186" width="196" height="62" rx="10"/><rect class="b human" x="676" y="196" width="176" height="42" rx="7"/><text class="bt" x="764" y="213" text-anchor="middle">/grilling: answer every</text><text class="bt" x="764" y="228" text-anchor="middle">decision</text><path class="arrow" d="M866 217 h6"/><path class="head" d="M872 213 l6 4 l-6 4z"/><text class="ct" x="880" y="82">Outline</text><text class="cn" x="880" y="99">stage 2: plans</text><rect class="grp" x="880" y="186" width="196" height="62" rx="10"/><rect class="b agent" x="890" y="196" width="176" height="42" rx="7"/><text class="bt" x="978" y="222" text-anchor="middle">Which plan files</text><path class="arrow" d="M1080 217 h6"/><path class="head" d="M1086 213 l6 4 l-6 4z"/><text class="ct" x="1094" y="82">Draft</text><text class="cn" x="1094" y="99">one writer per plan</text><rect class="grp" x="1094" y="134" width="196" height="166" rx="10"/><rect class="b cheap" x="1104" y="144" width="176" height="42" rx="7"/><text class="bt" x="1192" y="170" text-anchor="middle">Plan 1</text><rect class="b cheap" x="1104" y="196" width="176" height="42" rx="7"/><text class="bt" x="1192" y="222" text-anchor="middle">Plan 2</text><rect class="b cheap" x="1104" y="248" width="176" height="42" rx="7"/><text class="bt" x="1192" y="274" text-anchor="middle">Plan N</text><path class="arrow" d="M1294 217 h6"/><path class="head" d="M1300 213 l6 4 l-6 4z"/><text class="ct" x="1308" y="82">Critique</text><text class="cn" x="1308" y="99">gaps are repaired</text><rect class="grp" x="1308" y="160" width="196" height="114" rx="10"/><rect class="b agent" x="1318" y="170" width="176" height="42" rx="7"/><text class="bt" x="1406" y="187" text-anchor="middle">Check plans against your</text><text class="bt" x="1406" y="202" text-anchor="middle">decisions</text><rect class="b cheap" x="1318" y="222" width="176" height="42" rx="7"/><text class="bt" x="1406" y="248" text-anchor="middle">Repair flagged files</text>
<rect class="b cheap" x="24" y="349" width="12" height="12" rx="3"/><text class="cn" x="42" y="359">cheaper model (Sonnet)</text><rect class="b agent" x="205.2" y="349" width="12" height="12" rx="3"/><text class="cn" x="223.2" y="359">session model</text><rect class="b result" x="327" y="349" width="12" height="12" rx="3"/><text class="cn" x="345" y="359">output</text><rect class="b human" x="402.6" y="349" width="12" height="12" rx="3"/><text class="cn" x="420.6" y="359">you</text>
</svg>